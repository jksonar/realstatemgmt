{% extends 'base.html' %}

{% block title %}Password Changed{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h1 class="h4 mb-0">Password Changed Successfully</h1>
                </div>
                <div class="card-body">
                    <div class="alert alert-success" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i> Your password has been changed successfully.
                    </div>
                    <p>Your password has been changed. You may go ahead and use your new password to log in.</p>
                    <div class="mt-4">
                        <a href="{% url 'profile' %}" class="btn btn-primary">
                            <i class="bi bi-person me-1"></i> Back to Profile
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
